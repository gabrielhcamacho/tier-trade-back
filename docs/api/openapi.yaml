openapi: 3.1.0
info:
  title: Tier Trade API
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      security: []
      summary: Verifica o processo da API
      responses: { '200': { description: Processo saudável } }
  /health/ready:
    get:
      security: []
      summary: Verifica a conexão com o banco
      responses:
        '200': { description: API pronta }
        '503': { description: Dependência indisponível }
  /v1/session:
    get:
      summary: Resolve o tenant e as capabilities do usuário autenticado
      responses:
        '200': { description: Sessão de acesso resolvida }
        '403': { description: Usuário sem membership ativa }
  /v1/access/invitations:
    post:
      summary: Convida um usuário e concede acesso ao tenant do administrador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, capabilities]
              properties:
                email: { type: string, format: email }
                capabilities:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/Capability' }
      responses:
        '201': { description: Convite enviado e membership criada }
        '404': { description: Administrador sem capability ACCESS_MANAGE }
        '409': { description: Convite aberto ou usuário já vinculado }
        '503': { description: Provedor de identidade indisponível ou não configurado }
  /v1/counterparties:
    get:
      summary: Lista contrapartes do tenant resolvido
      responses: { '200': { description: Contrapartes disponíveis } }
  /v1/offers:
    post:
      summary: Registra uma oferta e seu cenário determinístico
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOffer' } } }
      responses:
        '201': { description: Oferta criada }
        '422': { description: Regra de domínio inválida }
  /v1/offers/{offerId}:
    put:
      summary: Cria nova versão do cenário de um rascunho
      parameters:
        - $ref: '#/components/parameters/OfferId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOffer' } } }
      responses:
        '200': { description: Oferta e cenário atualizados }
        '409': { description: Oferta não está em rascunho }
  /v1/offers/{offerId}/cancel:
    post:
      summary: Cancela oferta antes da ativação do contrato
      parameters:
        - $ref: '#/components/parameters/OfferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 3, maxLength: 500 } }
      responses:
        '201': { description: Oferta cancelada }
        '409': { description: Oferta já convertida ou cancelada }
  /v1/offers/{offerId}/submit:
    post:
      summary: Submete oferta à política de margem
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses: { '201': { description: Decisão de submissão } }
  /v1/approvals/{approvalId}/approve:
    post:
      summary: Aprova uma exceção comercial
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '201': { description: Exceção aprovada } }
  /v1/offers/{offerId}/activate-contract:
    post:
      summary: Converte oferta aprovada em contrato ativo
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses: { '201': { description: Contrato ativado } }
  /v1/contracts/{contractId}/summary:
    get:
      summary: Retorna resumo operacional do contrato
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Resumo do contrato } }
  /v1/contracts/{contractId}/loads:
    get:
      summary: Lista a agenda e os saldos físicos do contrato
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Agenda operacional } }
    post:
      summary: Programa uma carga e reserva saldo do contrato
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Carga programada }
        '422': { description: Janela ou saldo contratual inválido }
  /v1/loads/{loadId}:
    get:
      summary: Retorna carga, recebimento vigente, versões e eventos auditados
      parameters:
        - { name: loadId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Detalhe operacional da carga } }
  /v1/loads/{loadId}/start-receiving:
    post:
      summary: Move uma carga programada para recebimento
      parameters:
        - { name: loadId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Recebimento iniciado }
        '409': { description: Estado da carga incompatível }
  /v1/loads/{loadId}/receipt:
    put:
      summary: Registra uma nova versão de pesagem e classificação
      parameters:
        - { name: loadId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordLoadReceipt' }
      responses:
        '200': { description: Registro criado ou corrigido em nova versão }
        '409': { description: Recebimento ainda não iniciado }
        '422': { description: Pesos ou evidência de contingência inválidos }
  /v1/inventory:
    get:
      summary: Retorna posição por lote e o livro de movimentos do tenant
      responses:
        '200': { description: Saldos físicos, lotes e movimentos calculados no backend }
  /v1/inventory/sales-contracts:
    post:
      summary: Cria um contrato de venda ativo
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SalesContractInput' } } }
      responses:
        '201': { description: Contrato de venda criado }
        '409': { description: Referência já utilizada }
  /v1/inventory/sales-contracts/{contractId}:
    put:
      summary: Atualiza contrato de venda sem reduzir abaixo do volume alocado
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SalesContractInput' } } }
      responses:
        '200': { description: Contrato atualizado }
        '422': { description: Volume inferior ao saldo já alocado }
  /v1/inventory/allocations:
    post:
      summary: Reserva saldo disponível de um lote para contrato de venda
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AllocationInput' } } }
      responses:
        '201': { description: Alocação criada }
        '422': { description: Saldo de lote ou contrato insuficiente }
  /v1/inventory/allocations/{allocationId}/release:
    post:
      summary: Libera alocação ativa que ainda não possui expedições
      parameters:
        - { name: allocationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Alocação liberada }
        '409': { description: Alocação já executada ou inativa }
  /v1/inventory/dispatches:
    post:
      summary: Registra expedição e movimento negativo de estoque atomicamente
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DispatchInput' } } }
      responses:
        '201': { description: Expedição confirmada e previsão financeira criada atomicamente }
        '422': { description: Saldo alocado ou físico insuficiente }
  /v1/finance:
    get:
      summary: Retorna previsões de recebimento, títulos, baixas e saldos do tenant
      responses:
        '200': { description: Workspace financeiro calculado a partir dos registros oficiais }
  /v1/finance/titles:
    post:
      summary: Emite título a receber para uma previsão financeira pronta
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateFinancialTitle' } } }
      responses:
        '201': { description: Título emitido }
        '409': { description: Título existente ou política de arredondamento pendente }
  /v1/finance/titles/{titleId}/settlements:
    post:
      summary: Registra recebimento parcial ou total de um título
      parameters:
        - { name: titleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettleFinancialTitle' } } }
      responses:
        '201': { description: Recebimento registrado e saldo atualizado }
        '422': { description: Valor superior ao saldo do título }
  /v1/finance/settlements/{settlementId}/reverse:
    post:
      summary: Estorna uma baixa preservando o registro original
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties: { reason: { type: string, minLength: 3, maxLength: 500 } }
      responses:
        '201': { description: Baixa estornada e saldo recomposto }
        '409': { description: Baixa já estornada }
  /v1/finance/titles/{titleId}/payments:
    post:
      summary: Registra pagamento parcial ou total de um título fiscal
      parameters:
        - { name: titleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PayFinancialTitle' } } }
      responses:
        '201': { description: Pagamento registrado; título, obrigação e caixa atualizados atomicamente }
        '409': { description: Título não é uma obrigação fiscal ou referência bancária já utilizada }
        '422': { description: Pagamento superior ao saldo em aberto }
  /v1/finance/payments/{paymentId}/reverse:
    post:
      summary: Estorna pagamento fiscal preservando o registro original
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties: { reason: { type: string, minLength: 3, maxLength: 500 } }
      responses:
        '201': { description: Pagamento estornado; saldos e status recompostos }
        '409': { description: Pagamento já estornado }
  /v1/risk:
    get:
      summary: Consolida posição física, contratual, financeira e limites do tenant
      responses:
        '200': { description: Posição calculada; métricas de mercado não configuradas são explicitamente bloqueadas }
  /v1/fiscal:
    get:
      summary: Retorna documentos fiscais, cadeia operacional e pendências do tenant
      responses:
        '200': { description: Workspace fiscal com documentos, estabelecimentos, versões e estado explícito do cálculo }
  /v1/fiscal/establishments:
    post:
      summary: Cadastra estabelecimento fiscal do tenant
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FiscalEstablishmentInput' } } }
      responses:
        '201': { description: Estabelecimento cadastrado }
        '409': { description: CNPJ já cadastrado no tenant }
  /v1/fiscal/establishments/{establishmentId}:
    patch:
      summary: Atualiza cadastro e regime de estabelecimento fiscal
      parameters:
        - { name: establishmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FiscalEstablishmentInput' } } }
      responses:
        '200': { description: Estabelecimento atualizado }
  /v1/fiscal/authorities:
    post:
      summary: Cadastra uma autoridade fiscal favorecida pelo recolhimento
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FiscalAuthorityInput' } } }
      responses:
        '201': { description: Autoridade cadastrada para o tenant }
        '409': { description: Autoridade equivalente já cadastrada }
  /v1/fiscal/configurations:
    post:
      summary: Cria a primeira versão em rascunho de uma configuração fiscal
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FiscalConfigurationInput' } } }
      responses:
        '201': { description: Versão 1 criada como rascunho }
  /v1/fiscal/configurations/{configurationId}:
    patch:
      summary: Atualiza uma configuração fiscal ainda em rascunho
      parameters:
        - { name: configurationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FiscalConfigurationInput' } } }
      responses:
        '200': { description: Rascunho atualizado }
        '409': { description: Versão ativa ou encerrada é imutável }
  /v1/fiscal/configurations/{configurationId}/activate:
    post:
      summary: Ativa versão fiscal completa e encerra a anterior da mesma chave
      parameters:
        - { name: configurationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Versão ativada }
        '409': { description: Vigência sobreposta ou versão imutável }
        '422': { description: Configuração incompleta }
  /v1/fiscal/configurations/{configurationId}/new-version:
    post:
      summary: Clona versão ativa ou encerrada como novo rascunho
      parameters:
        - { name: configurationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Próxima versão criada como rascunho }
        '409': { description: Já existe um rascunho sucessor }
  /v1/fiscal/calculations:
    post:
      summary: Seleciona a configuração ativa e persiste uma memória fiscal determinística
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateFiscalCalculation' } } }
      responses:
        '201': { description: Cálculo criado ou repetição idempotente retornada }
        '409': { description: Configuração ambígua, inválida ou chave idempotente divergente }
        '422': { description: Nenhuma configuração aplicável ou retenção superior ao bruto }
  /v1/fiscal/calculations/{calculationId}/accept:
    post:
      summary: Aceita a memória e gera obrigações e efeitos financeiros atômicos
      parameters:
        - { name: calculationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AcceptFiscalCalculation' } } }
      responses:
        '201': { description: Obrigações, ajustes e títulos fiscais criados ou repetição idempotente retornada }
        '409': { description: Aceite anterior divergente, título insuficiente ou conjunto de obrigações incompatível }
  /v1/fiscal/documents:
    post:
      summary: Registra NF-e de saída vinculada a um evento financeiro de expedição
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateFiscalDocument' } } }
      responses:
        '201': { description: Documento recebido para conferência }
        '409': { description: Documento, expedição ou chave já registrada }
  /v1/fiscal/documents/{documentId}:
    patch:
      summary: Corrige documento e o devolve para conferência
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateFiscalDocument' } } }
      responses:
        '200': { description: Correção persistida e vínculo financeiro removido até nova validação }
  /v1/fiscal/documents/{documentId}/validate:
    post:
      summary: Valida chave e valor e vincula o título financeiro existente
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Documento validado }
        '422': { description: Chave ausente ou valor divergente }
  /v1/fiscal/documents/{documentId}/reject:
    post:
      summary: Rejeita documento com motivo, preservando o histórico
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties: { reason: { type: string, minLength: 3, maxLength: 500 } }
      responses:
        '201': { description: Documento rejeitado e título desvinculado }
  /v1/risk/policy:
    patch:
      summary: Publica nova versão do limite de posição líquida por commodity
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConfigureRiskPolicy' } } }
      responses:
        '200': { description: Política versionada e ativada }
        '404': { description: Usuário sem capability RISK_MANAGE }
  /v1/settings/margin-policy/MILHO:
    get:
      summary: Retorna a política ativa de margem do milho
      responses: { '200': { description: Política ativa } }
  /v1/settings/margin-policy:
    patch:
      summary: Publica nova versão da política de margem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commodity, autoApprovalMarginPerSc, absoluteFloorMarginPerSc]
              properties:
                commodity: { const: MILHO }
                autoApprovalMarginPerSc: { $ref: '#/components/schemas/DecimalString' }
                absoluteFloorMarginPerSc: { $ref: '#/components/schemas/DecimalString' }
      responses:
        '200': { description: Nova versão publicada }
        '422': { description: Piso superior ao limite automático }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    OfferId:
      name: offerId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Capability:
      type: string
      enum: [COMMERCIAL_EDIT, COMMERCIAL_APPROVE, COMMERCIAL_CANCEL, MARGIN_POLICY_MANAGE, ACCESS_MANAGE, OPERATIONS_EDIT, FINANCE_EDIT, FISCAL_EDIT, RISK_MANAGE]
    DecimalString: { type: string, pattern: '^\d+(?:\.\d{1,6})?$' }
    CreateOffer:
      type: object
      additionalProperties: false
      required: [counterpartyId, commodity, unit, quantitySc, deliveryStart, deliveryEnd, purchasePricePerSc, saleReferencePerSc, costs]
      properties:
        counterpartyId: { type: string, format: uuid }
        commodity: { const: MILHO }
        unit: { const: SC_60KG }
        quantitySc: { $ref: '#/components/schemas/DecimalString' }
        deliveryStart: { type: string, format: date }
        deliveryEnd: { type: string, format: date }
        purchasePricePerSc: { $ref: '#/components/schemas/DecimalString' }
        saleReferencePerSc: { $ref: '#/components/schemas/DecimalString' }
        costs:
          type: array
          items:
            type: object
            required: [code, amountPerSc]
            properties:
              code: { enum: [FREIGHT, STORAGE, QUALITY, FINANCIAL, OTHER] }
              amountPerSc: { $ref: '#/components/schemas/DecimalString' }
    RecordLoadReceipt:
      type: object
      additionalProperties: false
      required: [receivedAt, grossWeightKg, tareWeightKg, weighingMode, moisturePct, impurityPct, damagedPct, qualityDecision]
      properties:
        receivedAt: { type: string, format: date-time }
        grossWeightKg: { type: string, pattern: '^\d+(?:\.\d{1,3})?$' }
        tareWeightKg: { type: string, pattern: '^\d+(?:\.\d{1,3})?$' }
        weighingMode: { enum: [SCALE, MANUAL_CONTINGENCY] }
        scaleTicketNumber: { type: [string, 'null'], maxLength: 80 }
        contingencyReason: { type: [string, 'null'], minLength: 10, maxLength: 500 }
        moisturePct: { type: string, pattern: '^\d+(?:\.\d{1,4})?$' }
        impurityPct: { type: string, pattern: '^\d+(?:\.\d{1,4})?$' }
        damagedPct: { type: string, pattern: '^\d+(?:\.\d{1,4})?$' }
        qualityDecision: { enum: [ACCEPTED, REVIEW_REQUIRED] }
        notes: { type: [string, 'null'], maxLength: 1000 }
    SalesContractInput:
      type: object
      additionalProperties: false
      required: [counterpartyId, reference, commodity, quantityKg, salePricePerKg, destinationCode, deliveryStart, deliveryEnd, requiredDocuments]
      properties:
        counterpartyId: { type: string, format: uuid }
        reference: { type: string, minLength: 3, maxLength: 40 }
        commodity: { const: MILHO }
        quantityKg: { $ref: '#/components/schemas/DecimalString' }
        salePricePerKg: { $ref: '#/components/schemas/DecimalString' }
        destinationCode: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,31}$' }
        deliveryStart: { type: string, format: date }
        deliveryEnd: { type: string, format: date }
        requiredDocuments: { type: array, maxItems: 20, items: { type: string, maxLength: 80 } }
        paymentTermDays: { type: [integer, 'null'], minimum: 0, maximum: 730 }
    AllocationInput:
      type: object
      additionalProperties: false
      required: [salesContractId, lotId, quantityKg]
      properties:
        salesContractId: { type: string, format: uuid }
        lotId: { type: string, format: uuid }
        quantityKg: { $ref: '#/components/schemas/DecimalString' }
    DispatchInput:
      type: object
      additionalProperties: false
      required: [allocationId, quantityKg, dispatchedAt, vehiclePlate, documentReference, notes]
      properties:
        allocationId: { type: string, format: uuid }
        quantityKg: { $ref: '#/components/schemas/DecimalString' }
        dispatchedAt: { type: string, format: date-time }
        vehiclePlate: { type: string, pattern: '^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$' }
        documentReference: { type: string, minLength: 1, maxLength: 80 }
        notes: { type: [string, 'null'], maxLength: 1000 }
    CreateFinancialTitle:
      type: object
      additionalProperties: false
      required: [financialEventId, titleNumber, documentReference, dueDate]
      properties:
        financialEventId: { type: string, format: uuid }
        titleNumber: { type: string, minLength: 3, maxLength: 40 }
        documentReference: { type: string, minLength: 1, maxLength: 80 }
        dueDate: { type: string, format: date }
    SettleFinancialTitle:
      type: object
      additionalProperties: false
      required: [amount, receivedAt, bankReference, notes]
      properties:
        amount: { type: string, pattern: '^\d+(?:\.\d{1,2})?$' }
        receivedAt: { type: string, format: date-time }
        bankReference: { type: string, minLength: 1, maxLength: 80 }
        notes: { type: [string, 'null'], maxLength: 1000 }
    PayFinancialTitle:
      type: object
      additionalProperties: false
      required: [amount, paidAt, bankReference, notes]
      properties:
        amount: { type: string, pattern: '^\d+(?:\.\d{1,2})?$' }
        paidAt: { type: string, format: date-time }
        bankReference: { type: string, minLength: 1, maxLength: 80 }
        notes: { type: [string, 'null'], maxLength: 1000 }
    ConfigureRiskPolicy:
      type: object
      additionalProperties: false
      required: [commodity, maxNetOpenKg, warningThresholdPct]
      properties:
        commodity: { const: MILHO }
        maxNetOpenKg: { type: string, pattern: '^\d+(?:\.\d{1,3})?$' }
        warningThresholdPct: { type: string, pattern: '^\d+(?:\.\d{1,2})?$' }
    CreateFiscalDocument:
      allOf:
        - $ref: '#/components/schemas/UpdateFiscalDocument'
        - type: object
          required: [financialEventId]
          properties:
            financialEventId: { type: string, format: uuid }
    UpdateFiscalDocument:
      type: object
      additionalProperties: false
      required: [documentNumber, accessKey, issuedAt, totalAmount, validationNotes]
      properties:
        documentNumber: { type: string, minLength: 1, maxLength: 40 }
        accessKey: { type: [string, 'null'], pattern: '^\d{44}$' }
        issuedAt: { type: string, format: date-time }
        totalAmount: { type: string, pattern: '^\d+(?:\.\d{1,2})?$' }
        validationNotes: { type: [string, 'null'], minLength: 3, maxLength: 1000 }
    FiscalEstablishmentInput:
      type: object
      additionalProperties: false
      required: [legalName, taxId, stateRegistration, uf, taxRegime]
      properties:
        legalName: { type: string, minLength: 3, maxLength: 180 }
        taxId: { type: string, pattern: '^\d{14}$' }
        stateRegistration: { type: [string, 'null'], minLength: 2, maxLength: 30 }
        uf: { type: string, pattern: '^[A-Z]{2}$' }
        taxRegime: { type: [string, 'null'], enum: [SIMPLES_NACIONAL, LUCRO_PRESUMIDO, LUCRO_REAL, null] }
    FiscalConfigurationInput:
      type: object
      additionalProperties: false
      required: [establishmentId, name, commodity, destinationUf, cfop, emissionStrategy, technicalResponsible, effectiveFrom, effectiveTo, roundingMode, roundingScale, taxComponents]
      properties:
        establishmentId: { type: [string, 'null'], format: uuid }
        name: { type: string, minLength: 3, maxLength: 120 }
        commodity: { type: [string, 'null'], minLength: 2, maxLength: 40 }
        destinationUf: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
        cfop: { type: [string, 'null'], pattern: '^\d{4}$' }
        emissionStrategy: { type: [string, 'null'], enum: [NATIVE, INTEGRATED, null] }
        technicalResponsible: { type: [string, 'null'], minLength: 3, maxLength: 160 }
        effectiveFrom: { type: [string, 'null'], format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        roundingMode: { type: [string, 'null'], enum: [HALF_UP, HALF_EVEN, DOWN, UP, null] }
        roundingScale: { type: [integer, 'null'], minimum: 0, maximum: 6 }
        taxComponents:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/FiscalTaxComponent' }
    FiscalAuthorityInput:
      type: object
      additionalProperties: false
      required: [legalName, taxId, jurisdiction, uf]
      properties:
        legalName: { type: string, minLength: 3, maxLength: 180 }
        taxId: { type: [string, 'null'], pattern: '^\d{11,14}$' }
        jurisdiction: { type: string, enum: [FEDERAL, STATE, MUNICIPAL] }
        uf: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
    FiscalTaxComponent:
      type: object
      additionalProperties: false
      required: [tax, treatment, basis, ratePct, retained]
      properties:
        tax: { type: string, enum: [ICMS, PIS, COFINS, FUNRURAL] }
        treatment: { type: string, enum: [TAXED, EXEMPT, NON_TAXED, DEFERRED, SUSPENDED] }
        basis: { type: [string, 'null'], enum: [DOCUMENT_TOTAL, null] }
        ratePct: { type: [string, 'null'], pattern: '^\d+(?:\.\d{1,6})?$' }
        retained: { type: boolean }
    CreateFiscalCalculation:
      type: object
      additionalProperties: false
      required: [requestKey, establishmentId, operationType, commodity, destinationUf, occurredOn, grossAmount, currency, sourceType, sourceId]
      properties:
        requestKey: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        operationType: { const: SALE_DISPATCH }
        commodity: { type: string, minLength: 2, maxLength: 40 }
        destinationUf: { type: string, pattern: '^[A-Z]{2}$' }
        occurredOn: { type: string, format: date }
        grossAmount: { type: string, pattern: '^(?:0|[1-9]\d{0,17})(?:\.\d{1,6})?$' }
        currency: { const: BRL }
        sourceType: { type: string, enum: [MANUAL, FISCAL_DOCUMENT, FINANCIAL_EVENT] }
        sourceId: { type: [string, 'null'], format: uuid }
    AcceptFiscalCalculation:
      type: object
      additionalProperties: false
      required: [requestKey, obligations]
      properties:
        requestKey: { type: string, format: uuid }
        obligations:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [tax, authorityId, competenceDate, dueDate, titleEffect, paymentResponsibility, titleNumber, documentReference]
            properties:
              tax: { type: string, enum: [ICMS, PIS, COFINS, FUNRURAL] }
              authorityId: { type: string, format: uuid }
              competenceDate: { type: string, format: date }
              dueDate: { type: string, format: date }
              titleEffect: { type: string, enum: [NONE, REDUCE_SOURCE_TITLE] }
              paymentResponsibility: { type: string, enum: [TENANT, COUNTERPARTY] }
              titleNumber: { type: [string, 'null'], minLength: 3, maxLength: 40 }
              documentReference: { type: [string, 'null'], minLength: 1, maxLength: 80 }
